    <style>
        /* Hero section */
        .hero {
            display: flex;
            justify-content: center; /* Center the content horizontally */
            align-items: center; /* Center the content vertically */
            min-height: 100vh; /* Full height of the viewport */
        }

        /* bus container */
        .bus-container {
            background-color: #f0f0f0; /* Light grey background for the container */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            width: 90%;
            text-align: center;
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center all child elements horizontally */
        }

        /* bus name centered */
        #bus-name {
            font-size: 2em;
            color: #000000;
            margin-bottom: 20px; /* Add space below the bus name */
        }

        /* bus form */
        .bus-form {
            padding: 20px;
            display: flex;
            flex-direction: row; /* Arrange image and form side by side */
            align-items: flex-start; /* Align items to the start */
            gap: 100px; /* Space between image and form */
            width: 90%;
            justify-content: center;
        }

        .bus-form p {
            color: black;
            font-size: 16pt;
            font-weight: bold;
        }

        .bus-form h2 {
            color: black;
            font-size: 16pt;
            font-weight: bold;
        }

        /* Left column (bus image) */
        .bus-form img {
            object-fit: cover;
            width: 40%; /* Set image width */
            height: auto; /* Maintain aspect ratio */
            border-radius: 10px; /* Optional: rounded corners */
        }

        /* Form and inputs */
        form {
            display: flex;
            flex-direction: column; /* Stack input elements vertically */
            align-items: center;
            gap: 10px; /* Space between the inputs */
        }

        /* Time inputs container */
        .time-inputs {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        input[type="datetime-local"] {
            width: 100%; /* Adjust width for two columns */
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        /* bus location */
        #bus-location {
            font-size: 18px;
            color: black;
            font-weight: bold;
        }

        /* Confirm button */
        .confirm-booking-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff; /* Blue button */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .confirm-booking-btn:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }

    </style>

    <script type="text/javascript">
        // Function to get query parameters from the URL
        function getQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                name: urlParams.get('data-name'),
                img: urlParams.get('img'),
                location: urlParams.get('location')
            };
        }

        // Display bus data based on URL parameters
        function displaybusDetails() {
            const params = getQueryParams();
            if (params.name && params.img && params.location) {
                document.getElementById('bus-name').textContent = params.name;
                document.getElementById('bus-image').src = params.img;
                document.getElementById('bus-location').textContent = params.name+" "+params.location;
            } else {
                document.getElementById('bus-name').textContent = "bus not found.";
            }
        }

        // Call the function to display the bus details
        displaybusDetails();

        // Sticky header on scroll
        window.addEventListener("scroll", function() {
            var header = document.querySelector("header");
            header.classList.toggle("sticky", window.scrollY > 0);    
        });
    </script>

    <script>
    // Function to dynamically load a script
    function loadScript(scriptName) {
        const script = document.createElement('script');
        script.src = `js/${scriptName}.js`;
        script.type = 'text/javascript';
        document.head.appendChild(script);
    }

    // Get the 'airport' URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const terminal = urlParams.get('data-name'); // Example: ?bus=ngurah

    // Dynamically load the script based on the 'terminal'' parameter
    if (terminal) {
        console.log(terminal);
        switch (terminal) {
            case 'Terminal Mengwi':
                loadScript('bali');
                break;
            case 'Terminal Cicaheum':
                loadScript('bandung');
                break;
            case 'Jakarta':
                loadScript('jakarta');
                break;
            default:
                console.log('Unknown terminal');
                break;
        }
    }
