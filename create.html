<body>
	<div class="main-w3layouts wrapper">
		<h1><strong>Destina 6 SignUp Form</strong></h1>
		<div class="main-agileinfo">
			<div class="agileits-top">
				<form method="post" onsubmit="return showAlert()">
					<input class="text" type="text" name="Username" placeholder="Username" required="">
					<input class="text email" type="email" name="email" placeholder="Email" required="">
					<input class="text" type="password" name="password" placeholder="Password" required="">
					<input class="text w3lpass" type="password" name="password" placeholder="Confirm Password" required="">
					<div class="wthree-text">
							<input type="checkbox" id="myCheckbox" required="">
							<label for="myCheckbox">I Agree To The Terms & Conditions</label>
						<div class="clear"> </div>
					</div>
					<input type="submit" value="SIGNUP">
				</form>
				<p>Already have an Account? <a href="sign.html"> Login Now!</a></p>
			</div>
		</div>
		<div class="destina6copy-agile">

			<li></li>
		</ul>
	</div>
	<script>
        function showAlert() {
            event.preventDefault();
            var checkbox = document.getElementById('myCheckbox');
            if (checkbox.checked) {
                alert("Kode verifikasi telah dikirimkan ke email.");
                return true; 
            } else {
                alert("Harap setujui syarat dan ketentuan.");
                return false; 
            }
        }
    </script>
