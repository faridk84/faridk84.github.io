<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destina 6</title>
    <link rel="icon" href="destina6.ico" type="image/x-icon">
    <link rel="stylesheet" href="gaya.css">
</head>
<body id="animated-background">
    <header>
        <a href="home.html" class="logo">DESTINA 6</a>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li> 
            <li><a href="sign.html">Sign In</a></li>
        </ul>
    </header>

    <div class="hero">
        <h2>Contact Us Here</h2>			
        <div class="search-and-tabs">
            <div class="tab-container">
                <div class="contact-container">
                    <!-- Gambar Contact -->
                    <img src="photos/contact.jpg" alt="Contact Us" style="width:100%; max-width:500px; display:block; margin:0 auto;">

                    <!-- Formulir Kontak -->
                    <form id="contact-form" style="margin-top:20px;">
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" required placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;"><br>

                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required placeholder="Your Email" style="width:100%; padding:10px; margin-bottom:10px;"><br>

                        <label for="phone">Phone:</label><br>
                        <input type="tel" id="phone" name="phone" required placeholder="Your Phone Number" style="width:100%; padding:10px; margin-bottom:10px;"><br>

                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" required placeholder="Your Message" style="width:100%; padding:10px; margin-bottom:10px;" rows="5"></textarea><br>

                        <button type="button" onclick="saveMessage()" style="padding:10px 20px; background-color:blue; color:white; border:none; cursor:pointer;">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
		<br></br>	
		<footer class="footer">
			<p>&copy; 2025 Destina 6. All rights reserved.</p>
		</footer>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
	<script src="background-animation.js"></script>
    <script src="save.js"></script>
	<script type="text/javascript">
        window.addEventListener("scroll", function(){
            var header = document.querySelector("header");
            header.classList.toggle("sticky", window.scrollY > 0);    
        })
    </script>
</body>
</html>
